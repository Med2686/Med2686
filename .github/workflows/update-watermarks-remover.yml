name: Mise à jour watermarks-remover

on:
  schedule:
    - cron: "17 6 * * 1" # chaque lundi, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la dernière version amont
        run: scripts/update-watermarks-remover.sh

      - name: Ouvrir une PR si quelque chose a changé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aucun changement."
            exit 0
          fi
          COMMIT="$(sed -n 's/^commit: //p' vendor/watermarks-remover/UPSTREAM)"
          BRANCH="update/watermarks-remover-${COMMIT:0:12}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Une PR existe déjà pour $COMMIT."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Mise à jour watermarks-remover vers ${COMMIT:0:12}"
          git push origin "$BRANCH"
          gh pr create --base "${{ github.ref_name }}" --head "$BRANCH" \
            --title "Mise à jour watermarks-remover (${COMMIT:0:12})" \
            --body "Mise à jour automatique de \`vendor/watermarks-remover\` et du skill \`.claude/skills/remove-ai-marks\` vers https://github.com/guillaumemeyer/watermarks-remover/commit/${COMMIT}. À relire avant fusion (code tiers)."
